name: CI

on:
  push:
    branches: [main, 'fix/**', 'feat/**', 'ci/**', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    env:
      AGENT_BRIDGE_CI_RESULTS_DIR: .agent-bridge-test/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Fast tests
        run: npm test
      - name: Integration tests
        if: success() || failure()
        run: npm run test:integration
      - name: Bundles are committed and up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: git diff --exit-code -- plugins
      - name: Test results and flaky diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-${{ matrix.os }}-node-${{ matrix.node }}
          path: .agent-bridge-test/ci/
          if-no-files-found: warn

  windows:
    name: Windows Node ${{ matrix.node }} shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    env:
      AGENT_BRIDGE_CI_RESULTS_DIR: .agent-bridge-test/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: List every shard and prove complete disjoint coverage
        run: npm run test:shards -- 4
      # Preserve the fast/integration deadlines and serial integration worker.
      # Each lane is partitioned by Vitest; no filters, retries or excluded tests.
      - name: CI-like Windows tests
        run: npm run test:ci-windows -- --shard=${{ matrix.shard }}/4
      - name: Verify the executed files match this shard
        if: always()
        run: node scripts/check-shard-results.mjs .agent-bridge-test/ci ${{ matrix.shard }}
      - name: Test results, shard inventory and flaky diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-windows-node-${{ matrix.node }}-shard-${{ matrix.shard }}
          path: .agent-bridge-test/ci/
          if-no-files-found: warn
