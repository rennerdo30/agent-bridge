name: CI

on:
  push:
    branches: [main, 'ci/ab283-windows-pretest']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    env:
      AGENT_BRIDGE_CI_RESULTS_DIR: .agent-bridge-test/ci
      AGENT_BRIDGE_CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Fast tests
        run: npm test -- --reporter=default --reporter=json --reporter=./scripts/ci-reporter.mjs --outputFile.json=.agent-bridge-test/ci/fast-results.json
      # Each file creates native processes and durable SQLite fixtures. Avoid
      # competing filesystem backfills on the shared Windows runner; retain
      # the same assertions and default deadlines for every test.
      - name: Integration tests
        if: success() || failure()
        run: npm run test:integration -- --reporter=default --reporter=json --reporter=./scripts/ci-reporter.mjs --outputFile.json=.agent-bridge-test/ci/integration-results.json
      - name: Bundles are committed and up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: git diff --exit-code -- plugins
      - name: Test results and flaky diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-${{ matrix.os }}-node-${{ matrix.node }}-attempt-${{ github.run_attempt }}
          path: .agent-bridge-test/ci/
          if-no-files-found: warn

  windows:
    name: Windows Node ${{ matrix.node }} shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    env:
      AGENT_BRIDGE_CI_RESULTS_DIR: .agent-bridge-test/ci
      AGENT_BRIDGE_CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Collect unsharded cases and prove complete disjoint coverage
        id: collect
        run: node scripts/check-test-shards.mjs 4 .agent-bridge-test/ci/shards.json --collect
      # The released runner retains lane filters, deadlines and worker limits.
      - name: Fast tests
        run: npm test -- --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --reporter=./scripts/ci-reporter.mjs --outputFile.json=.agent-bridge-test/ci/fast-results.json
      - name: Integration tests
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: npm run test:integration -- --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --reporter=./scripts/ci-reporter.mjs --outputFile.json=.agent-bridge-test/ci/integration-results.json
      - name: Verify exact collected and executed shard membership
        if: always()
        run: node scripts/check-shard-results.mjs .agent-bridge-test/ci ${{ matrix.shard }}
      - name: Retain shard inventory, results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-windows-node-${{ matrix.node }}-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: .agent-bridge-test/ci/
          if-no-files-found: error
