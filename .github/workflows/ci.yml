name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        if: runner.os != 'Windows'
      # Each file creates native processes and durable SQLite fixtures. Avoid
      # competing filesystem backfills on the shared Windows runner; retain
      # the same assertions and default deadlines for every test.
      - run: npm test -- --maxWorkers=1
        if: runner.os == 'Windows'
      - name: Bundles are committed and up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: git diff --exit-code -- plugins
