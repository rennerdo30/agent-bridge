name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Fast tests
        run: npm test
      # Each file creates native processes and durable SQLite fixtures. Avoid
      # competing filesystem backfills on the shared Windows runner; retain
      # the same assertions and default deadlines for every test.
      - name: Integration tests
        run: npm run test:integration
      - name: Bundles are committed and up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: git diff --exit-code -- plugins
