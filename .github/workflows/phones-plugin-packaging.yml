name: Phones plugin packaging publication

on:
  pull_request:
    paths:
      - '.github/workflows/phones-plugin-packaging.yml'
      - 'src/**'
      - 'scripts/build.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'plugins/**'
      - '.claude-plugin/marketplace.json'

permissions:
  contents: read

jobs:
  publication:
    if: github.event.pull_request.number == 10 && github.head_ref == 'ui/phones-in-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PHONES_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      PHONES_REVIEWED_HEAD: 283f70e345548c826fc16b5dafea7611acc72926
      PHONES_RELEASED_BASE: 0761d56fe4c36e505550f9b889841fdf8e82c80a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Record exact source and protected authored inventory before install
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, re, stat, subprocess, unicodedata

          root = pathlib.Path.cwd().resolve()
          workflow = '.github/workflows/phones-plugin-packaging.yml'
          dist_roots = [f'plugins/{plugin}/dist' for plugin in ('claude', 'codex', 'opencode', 'antigravity')]
          manifests = ['plugins/claude/.claude-plugin/plugin.json', 'plugins/codex/.codex-plugin/plugin.json',
                       'plugins/opencode/package.json', 'plugins/antigravity/package.json',
                       'plugins/antigravity/plugin.json', '.claude-plugin/marketplace.json']
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root).decode('utf-8').strip()
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          def safe_path(relative):
              path = pathlib.PurePosixPath(relative)
              require(relative and not path.is_absolute() and str(path) == relative, 'Noncanonical relative path: ' + relative)
              require('\\' not in relative and ':' not in relative and not any(ord(c) < 32 or ord(c) == 127 for c in relative), 'Unsafe path: ' + relative)
              require(unicodedata.normalize('NFC', relative) == relative, 'Noncanonical Unicode path: ' + relative)
              for part in path.parts:
                  require(part not in ('.', '..') and part.rstrip(' .') == part, 'Unsafe path component: ' + relative)
                  require(not re.fullmatch(r'(?i)(con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\..*)?', part), 'Reserved path: ' + relative)
              current = root
              for index, part in enumerate(path.parts):
                  current = current / part
                  metadata = current.lstat()
                  require(not stat.S_ISLNK(metadata.st_mode), 'Linked path: ' + relative)
                  if index < len(path.parts) - 1:
                      require(stat.S_ISDIR(metadata.st_mode), 'Nondirectory ancestor: ' + relative)
              require(current.resolve().is_relative_to(root), 'Escaped checkout: ' + relative)
              return current
          def generated(path):
              return any(path.startswith(prefix + '/') for prefix in dist_roots)
          def tracked_inventory():
              result, folded = [], set()
              for raw in subprocess.check_output(['git', 'ls-files', '--stage', '-z'], cwd=root).split(b'\0'):
                  if not raw:
                      continue
                  header, name = raw.split(b'\t', 1)
                  mode, blob, stage = header.decode('ascii').split()
                  relative = name.decode('utf-8')
                  require(stage == '0' and mode in ('100644', '100755'), 'Unsupported tracked entry: ' + relative)
                  require(relative.casefold() not in folded, 'Tracked case collision: ' + relative)
                  folded.add(relative.casefold())
                  path = safe_path(relative)
                  metadata = path.lstat()
                  require(stat.S_ISREG(metadata.st_mode) and metadata.st_nlink == 1, 'Nonregular/linked tracked file: ' + relative)
                  data = path.read_bytes()
                  require(git('hash-object', '--path=' + relative, relative) == blob, 'Tracked content differs from Git: ' + relative)
                  result.append({'path': relative, 'mode': mode, 'blob': blob, 'bytes': len(data), 'sha256': sha(data)})
              return sorted(result, key=lambda entry: entry['path'])

          require(os.environ.get('GITHUB_ACTIONS') == 'true' and os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted', 'Hosted runner required')
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          expected = os.environ['PHONES_SOURCE_HEAD']
          require(re.fullmatch('[0-9a-f]{40}', expected) is not None, 'Invalid event head')
          require(os.environ['GITHUB_EVENT_NAME'] == 'pull_request' and event['number'] == 10, 'PR10 event required')
          require(event['pull_request']['head']['sha'] == expected and event['pull_request']['head']['ref'] == 'ui/phones-in-dashboard', 'Event source mismatch')
          require(event['pull_request']['head']['repo']['full_name'] == os.environ['GITHUB_REPOSITORY'], 'Unexpected source repository')
          require(git('rev-parse', 'HEAD') == expected, 'Checkout differs from exact event head')
          require(not git('status', '--porcelain=v1', '--untracked-files=all'), 'Dirty initial checkout')
          reviewed = os.environ['PHONES_REVIEWED_HEAD']
          released = os.environ['PHONES_RELEASED_BASE']
          require(subprocess.run(['git', 'merge-base', '--is-ancestor', reviewed, expected], cwd=root).returncode == 0, 'Reviewed source is not an ancestor')
          require(subprocess.run(['git', 'merge-base', '--is-ancestor', released, expected], cwd=root).returncode == 0, 'Released base is not an ancestor')
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', reviewed, expected], cwd=root).split(b'\0')
          require(all(not name or name.decode('utf-8') == workflow or generated(name.decode('utf-8')) for name in changed), 'Protected source changed since reviewed283')
          inventory = tracked_inventory()
          protected = [entry for entry in inventory if not generated(entry['path'])]
          package = json.loads((root / 'package.json').read_text())
          lock = json.loads((root / 'package-lock.json').read_text())
          version = package['version']
          require(lock['version'] == lock['packages']['']['version'] == version, 'Package/lock version mismatch')
          require(f'APP_VERSION = "{version}"' in (root / 'src/core/constants.ts').read_text(), 'Constants version mismatch')
          for relative in manifests:
              value = json.loads((root / relative).read_text())
              require(all(plugin['version'] == version for plugin in value['plugins']) if isinstance(value.get('plugins'), list) else value['version'] == version, 'Authored manifest version mismatch: ' + relative)
          node = json.loads(subprocess.check_output(['node', '-p', 'JSON.stringify({version:process.version,platform:process.platform,arch:process.arch,versions:process.versions})'], text=True))
          require(node['platform'] == 'linux' and node['version'].startswith('v24.'), 'Hosted Ubuntu Node24 required')
          esbuild = lock['packages']['node_modules/esbuild']
          platform_key = f"node_modules/@esbuild/{node['platform']}-{node['arch']}"
          platform_package = lock['packages'][platform_key]
          require(package['devDependencies']['esbuild'] == esbuild['version'] == platform_package['version'], 'Locked esbuild version mismatch')
          require(esbuild.get('integrity') and platform_package.get('integrity'), 'Missing locked esbuild integrity')
          base_dir = root / '.agent-bridge-test'
          if not base_dir.exists():
              base_dir.mkdir()
          require(stat.S_ISDIR(base_dir.lstat().st_mode) and not base_dir.is_symlink(), 'Unsafe evidence parent')
          work = base_dir / 'phones-plugin-packaging'
          work.mkdir(exist_ok=False)
          record = {
              'schemaVersion': 1, 'sourceHead': expected, 'checkoutCommit': git('rev-parse', 'HEAD'),
              'checkoutTree': git('rev-parse', 'HEAD^{tree}'), 'checkoutParents': git('show', '-s', '--format=%P', 'HEAD').split(),
              'reviewedSourceHead': reviewed, 'reviewedSourceTree': git('rev-parse', reviewed + '^{tree}'), 'releasedComparison': released,
              'event': {'name': os.environ['GITHUB_EVENT_NAME'], 'pullRequest': event['number'], 'head': expected, 'base': event['pull_request']['base']['sha'], 'repository': os.environ['GITHUB_REPOSITORY']},
              'execution': {'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'job': os.environ['GITHUB_JOB'], 'jobDatabaseId': None,
                            'jobDatabaseIdEvidence': 'Not provided by runner environment; independent metadata acquisition required', 'runnerEnvironment': os.environ['RUNNER_ENVIRONMENT'],
                            'runnerOS': os.environ['RUNNER_OS'], 'runnerArch': os.environ['RUNNER_ARCH'], 'node': node, 'uname': list(os.uname()),
                            'osRelease': pathlib.Path('/etc/os-release').read_text(), 'npmVersion': subprocess.check_output(['npm', '--version'], text=True).strip()},
              'recipe': {'buildCommand': package['scripts']['build'], 'typecheckCommand': package['scripts']['typecheck'], 'packageVersion': version,
                         'lockedEsbuild': esbuild, 'lockedPlatformEsbuildKey': platform_key, 'lockedPlatformEsbuild': platform_package,
                         'actualEsbuildExecutableSha256': None, 'actualEsbuildExecutableEvidence': 'UNKNOWN: no independent executable byte measurement'},
              'authoredManifestPaths': manifests, 'distRoots': dist_roots,
              'protectedBefore': protected, 'trackedDistBefore': [entry for entry in inventory if generated(entry['path'])],
              'recipePinsBefore': [entry for entry in protected if entry['path'] in ['scripts/build.mjs', 'package.json', 'package-lock.json', 'src/core/constants.ts', workflow, *manifests]],
              'hashBasis': 'SHA256/length measure actual checkout bytes; Git blob comparison honors repository attributes, including declared CRLF files. Before/after byte equality is exact.',
              'beforeInstallAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'exclusions': ['Authored/non-dist files (hashes only)', 'node_modules', '.agent-bridge-test including archived prior chunks', '.git', 'owner/runtime/test data'],
          }
          (work / 'before.json').write_text(json.dumps(record, indent=2) + '\n')
          print('Recorded protected source files:', len(protected))
          PY
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Typecheck unchanged source
        id: typecheck
        run: npm run typecheck
      - name: Build once using the unchanged recipe
        id: build
        run: npm run build
      - name: Verify protected source and stage complete generated payload
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, re, stat, subprocess, unicodedata

          root = pathlib.Path.cwd().resolve()
          work = root / '.agent-bridge-test/phones-plugin-packaging'
          before = json.loads((work / 'before.json').read_text())
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root).decode('utf-8').strip()
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          def generated(path):
              return any(path.startswith(prefix + '/') for prefix in before['distRoots'])
          def safe_path(relative):
              path = pathlib.PurePosixPath(relative)
              require(relative and not path.is_absolute() and str(path) == relative and '\\' not in relative and ':' not in relative, 'Unsafe relative path: ' + relative)
              require(unicodedata.normalize('NFC', relative) == relative and not any(ord(c) < 32 or ord(c) == 127 for c in relative), 'Unsafe path spelling: ' + relative)
              current = root
              for index, part in enumerate(path.parts):
                  require(part not in ('.', '..') and part.rstrip(' .') == part and not re.fullmatch(r'(?i)(con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\..*)?', part), 'Unsafe path component: ' + relative)
                  current = current / part
                  metadata = current.lstat()
                  require(not stat.S_ISLNK(metadata.st_mode), 'Linked path: ' + relative)
                  if index < len(path.parts) - 1:
                      require(stat.S_ISDIR(metadata.st_mode), 'Nondirectory ancestor: ' + relative)
              require(current.resolve().is_relative_to(root), 'Path escaped checkout: ' + relative)
              return current

          require(git('rev-parse', 'HEAD') == before['sourceHead'] == os.environ['PHONES_SOURCE_HEAD'], 'Head changed during build')
          require(git('rev-parse', 'HEAD^{tree}') == before['checkoutTree'], 'Source tree changed during build')
          outcomes = {name: os.environ[name.upper() + '_OUTCOME'] for name in ('install', 'typecheck', 'build')}
          require(all(value == 'success' for value in outcomes.values()), 'Incomplete successful build receipt')
          after = []
          for entry in before['protectedBefore']:
              path = safe_path(entry['path'])
              metadata = path.lstat()
              require(stat.S_ISREG(metadata.st_mode) and metadata.st_nlink == 1, 'Protected file not regular: ' + entry['path'])
              data = path.read_bytes()
              current = {**entry, 'bytes': len(data), 'sha256': sha(data)}
              require(current == entry and git('hash-object', '--path=' + entry['path'], entry['path']) == entry['blob'], 'Protected source bytes changed: ' + entry['path'])
              require(bool(metadata.st_mode & 0o111) == (entry['mode'] == '100755'), 'Protected executable mode changed: ' + entry['path'])
              after.append(current)
          require(not git('diff', '--cached', '--name-only'), 'Index changed during build')
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z'], cwd=root).split(b'\0')
          require(all(not name or generated(name.decode('utf-8')) for name in changed), 'Unexpected non-dist Git delta')
          for raw in subprocess.check_output(['git', 'ls-files', '--others', '-z'], cwd=root).split(b'\0'):
              if raw:
                  path = raw.decode('utf-8')
                  require(generated(path) or path.startswith('node_modules/') or path.startswith('.agent-bridge-test/'), 'Unexpected untracked authored file: ' + path)
          package = json.loads((root / 'package.json').read_text())
          for relative in before['authoredManifestPaths']:
              value = json.loads((root / relative).read_text())
              require(all(plugin['version'] == package['version'] for plugin in value['plugins']) if isinstance(value.get('plugins'), list) else value['version'] == package['version'], 'Post-build manifest version mismatch: ' + relative)
          require(f'APP_VERSION = "{package["version"]}"' in (root / 'src/core/constants.ts').read_text(), 'Post-build constants version mismatch')
          installed_esbuild = json.loads((root / 'node_modules/esbuild/package.json').read_text())
          platform_esbuild = json.loads((root / before['recipe']['lockedPlatformEsbuildKey'] / 'package.json').read_text())
          require(installed_esbuild['version'] == platform_esbuild['version'] == before['recipe']['lockedEsbuild']['version'], 'Installed package metadata differs from locked recipe')
          before['recipe']['installedEsbuildPackageVersion'] = installed_esbuild['version']
          before['recipe']['installedPlatformEsbuildPackageVersion'] = platform_esbuild['version']
          payload = work / 'payload'
          payload.mkdir(exist_ok=False)
          files, directories, folded = [], [], set()
          required_entries = ('server.mjs', 'worker.mjs', 'cli.mjs', 'history-worker.mjs', 'backup-worker.mjs', 'outcome-worker.mjs', 'job-archive-worker.mjs')
          for dist in before['distRoots']:
              dist_path = safe_path(dist)
              require(stat.S_ISDIR(dist_path.lstat().st_mode), 'Missing dist directory: ' + dist)
              for parent, children, names in os.walk(dist_path, followlinks=False):
                  for name in sorted(children + names):
                      relative = (pathlib.Path(parent) / name).relative_to(root).as_posix()
                      path = safe_path(relative)
                      require(generated(relative) and relative.casefold() not in folded, 'Generated scope/case collision: ' + relative)
                      folded.add(relative.casefold())
                      metadata = path.lstat()
                      if stat.S_ISDIR(metadata.st_mode):
                          directories.append(relative)
                          (payload / relative).mkdir(parents=True, exist_ok=True)
                          continue
                      require(stat.S_ISREG(metadata.st_mode) and metadata.st_nlink == 1, 'Special/linked generated file: ' + relative)
                      data = path.read_bytes()
                      target = payload / relative
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with target.open('xb') as output:
                          output.write(data)
                      require(target.read_bytes() == data, 'Staged payload mismatch: ' + relative)
                      files.append({'path': relative, 'bytes': len(data), 'sha256': sha(data), 'mode': oct(stat.S_IMODE(metadata.st_mode))})
              paths = {entry['path'] for entry in files}
              require(all(dist + '/' + name in paths for name in required_entries), 'Missing reviewed recipe entrypoint: ' + dist)
              require(any(path.startswith(dist + '/chunks/') for path in paths), 'Missing generated chunks: ' + dist)
              require((payload / dist / 'cli.mjs').read_bytes().startswith(b'#!/usr/bin/env node\n'), 'Missing CLI shebang: ' + dist)
          require('plugins/opencode/dist/agent-bridge.js' in {entry['path'] for entry in files}, 'Missing OpenCode adapter')
          files.sort(key=lambda entry: entry['path'])
          summaries = {dist: {'files': sum(entry['path'].startswith(dist + '/') for entry in files),
                              'bytes': sum(entry['bytes'] for entry in files if entry['path'].startswith(dist + '/'))} for dist in before['distRoots']}
          before.update({'result': 'built-and-staged', 'protectedAfter': after, 'protectedSourceUnchanged': True,
                         'recipePinsAfter': [entry for entry in after if entry['path'] in {pin['path'] for pin in before['recipePinsBefore']}],
                         'buildReceipt': {'outcomes': outcomes, 'completedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'buildInvocations': 1},
                         'generated': {'files': files, 'directories': sorted(directories), 'fileCount': len(files), 'bytes': sum(entry['bytes'] for entry in files), 'trees': summaries,
                                       'emissionEvidence': 'Complete four dist trees present after the one unchanged recipe build; no per-file emission instrumentation'},
                         'limits': ['Publication only; no bundle application or source/visual review rebinding', 'Failed full CI is not waived',
                                    'Actual esbuild executable byte measurement is UNKNOWN', 'Independent archive/path/import/worker-route/parity review remains required',
                                    'No native/owner-runtime/physical-phone acceptance']})
          (payload / 'manifest.json').write_text(json.dumps(before, indent=2) + '\n')
          (payload / 'SOURCE_HEAD').write_text(before['sourceHead'] + '\n')
          checksums = [(entry['path'], entry['sha256']) for entry in files]
          checksums += [(name, sha((payload / name).read_bytes())) for name in ('manifest.json', 'SOURCE_HEAD')]
          (payload / 'SHA256SUMS').write_text(''.join(f'{digest}  {path}\n' for path, digest in sorted(checksums)))
          print(json.dumps({'sourceHead': before['sourceHead'], 'checkoutTree': before['checkoutTree'], 'generatedFiles': len(files), 'trees': summaries}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phones-plugins-${{ github.event.pull_request.head.sha }}
          path: .agent-bridge-test/phones-plugin-packaging/payload/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
