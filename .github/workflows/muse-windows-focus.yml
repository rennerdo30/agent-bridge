name: Muse Windows synthetic focus

on:
  push:
    branches: [feat/muse-support]
  workflow_dispatch:

permissions:
  contents: read

# Temporary AB-330 diagnosis only. Remove before requesting separate review;
# the unchanged full CI and retention workflows still gate the final candidate.
jobs:
  synthetic-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Signed handoff diagnostic (synthetic, no secret values)
        run: npm run test:integration -- test/muse-context.test.ts -t "sanitized Windows runtime|restores only sanctioned Bridge context" --disableConsoleIntercept
      - name: Synthetic context and native-shaped hosts only
        run: npm run test:integration -- test/muse-context.test.ts test/muse-native.test.ts
